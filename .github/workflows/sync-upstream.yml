name: sync upstream

# Mirrors github.com/zhaoxuya520/reverse-skill and opens a pull request when the
# vendored corpus drifts. Nothing is published from here: review the pull
# request, merge it, then tag a release to publish.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Mirror the upstream corpus
        id: mirror
        run: |
          node tools/sync-upstream.mjs
          node -e "const u=require('./upstream.json');require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'commit='+u.commit+'\n')"

      - name: Verify the mirrored tree
        run: |
          pnpm run verify
          node tools/test-provider.mjs

      - name: Open or refresh the sync pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/sync-upstream
          delete-branch: true
          title: "chore: sync upstream reverse-skill @${{ steps.mirror.outputs.commit }}"
          commit-message: "chore: sync upstream reverse-skill"
          labels: automated,upstream-sync
          body: |
            Automated mirror of [`zhaoxuya520/reverse-skill`](https://github.com/zhaoxuya520/reverse-skill).

            - upstream commit: `${{ steps.mirror.outputs.commit }}`
            - `upstream.json` and `tools/upstream-files.json` are regenerated by `tools/sync-upstream.mjs`
            - the package patch version is bumped automatically

            Merge this pull request, then tag a release to publish.
